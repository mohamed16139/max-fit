<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body Recomp Program</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0B0B0B">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Manga Fit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#0B0B0B; --card:#161616; --ink:#F2F2F2; --steel:#A3A3A3; --line:#2A2A2A;
  --plate:#FF7A1A; --plate-soft:#3A2210; --blue-soft:#242424; --on-plate:#111111;
  --bar2:#FFB570; --bar3:#6B6B6B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--paper:#F5F5F5; --card:#FFFFFF; --ink:#111111; --steel:#5E5E5E; --line:#DDDDDD; --plate:#E85D00; --plate-soft:#FFE3CC; --blue-soft:#EEEEEE; --on-plate:#111111; --bar2:#FFB570; --bar3:#9A9A9A;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 15px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.hidden{display:none!important}
button:focus-visible,input:focus-visible{outline:2px solid var(--plate);outline-offset:2px}

/* login */
.login{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px;border-top:6px solid var(--plate)}
.login h1{font-size:40px;line-height:1;margin:0 0 6px}
.login p{margin:0 0 20px;color:var(--steel)}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px}
.err{color:var(--plate);font-size:14px;min-height:20px;margin:-4px 0 10px}
.btn{width:100%;font:600 18px "Barlow Condensed",sans-serif;background:var(--plate);color:var(--on-plate);border:0;border-radius:8px;padding:12px;cursor:pointer;letter-spacing:.3px}

/* app */
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
header h1{font-size:40px;line-height:1;margin:0}
.sub{color:var(--steel);margin-top:4px}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;font:600 18px "Barlow Condensed",sans-serif;color:var(--steel);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--plate)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.dayb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;font:inherit}
.dayb small{display:block;color:var(--steel);font-size:12px}
.dayb b{font:600 17px "Barlow Condensed",sans-serif}
.dayb.rest{background:transparent}
.dayb[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.dayb[aria-pressed="true"] small{color:inherit;opacity:.75}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{margin:0 0 4px;font-size:28px}
.note{font-size:14px;color:var(--steel);margin:0 0 12px}
.ex{display:grid;grid-template-columns:34px 1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .i{font:700 20px "Barlow Condensed",sans-serif;color:var(--plate);text-align:center}
.ex .name{font-weight:600;font-size:16px}
.ex .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:var(--blue-soft);border-radius:4px;padding:2px 8px;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.r{background:var(--plate-soft)}
.group{font:600 15px "Barlow Condensed",sans-serif;color:var(--steel);margin:14px 0 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:16px}
.panel h3{font-size:21px;margin:0 0 6px}
ul{margin:0;padding-left:18px} li{margin:3px 0}
.guide{columns:2 320px;column-gap:28px}
.guide section{break-inside:avoid;margin-bottom:18px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{color:var(--steel);font-weight:600;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.calc{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.calc input{width:140px;margin:0}
.big{font:700 34px "Barlow Condensed",sans-serif;line-height:1.1}
select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.kcal{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
.kcal .big{font-size:44px;color:var(--plate)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.macro{background:var(--paper);border-radius:8px;padding:10px 12px}
.macro .big{font-size:30px}
.macro small{display:block;color:var(--steel);font-size:13px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:12px}
.bar span:nth-child(1){background:var(--plate)}.bar span:nth-child(2){background:var(--bar2)}.bar span:nth-child(3){background:var(--bar3)}
@media (max-width:560px){.macros{gap:6px}.macro{padding:8px}.macro .big{font-size:24px}.kcal .big{font-size:38px}}
@media (max-width:760px){.week{grid-template-columns:repeat(4,1fr)}}
@media (max-width:560px){
  .wrap{padding:14px 12px 40px}
  header h1{font-size:32px}
  .hdr-actions{width:100%}.hdr-actions .ghost{flex:1;padding:9px 10px}
  nav.tabs button{flex:1;padding:10px 6px;font-size:17px}
  .week{grid-template-columns:repeat(3,1fr)}
  .dayb{padding:8px}.dayb b{font-size:16px}
  .panel{padding:14px 12px}.panel h2{font-size:24px}
  .ex{grid-template-columns:28px 1fr}.ex .meta{grid-column:2;justify-content:flex-start}
  .two{grid-template-columns:1fr}
  .calc input{width:100%}.calc>div{flex:1 1 140px}
}

/* exercise photos */
.ex[role="button"]{cursor:pointer}
.ex .name::after{content:"";display:inline-block;width:7px;height:7px;margin-left:8px;border-right:2px solid var(--steel);border-bottom:2px solid var(--steel);transform:translateY(-3px) rotate(45deg);transition:transform .15s}
.ex[aria-expanded="true"] .name::after{transform:translateY(0) rotate(-135deg)}
.ex:focus-visible{outline:2px solid var(--plate);outline-offset:2px;border-radius:6px}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 12px}
.shots figure{margin:0}
.shots img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:8px;background:var(--paper)}
.shots figcaption{font-size:12px;color:var(--steel);margin-top:4px}

/* diet plan */
.pick h3{font-size:19px;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.chip[aria-pressed="true"]{background:var(--plate);color:var(--on-plate);border-color:var(--plate);font-weight:600}
.meal{list-style:none;padding:0;margin:0 0 12px}.meal li{padding:6px 0;border-bottom:1px solid var(--line)}
.totr td{font-weight:600;border-top:2px solid var(--line)}
.mealc{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--paper)}
.mealc.day{border-color:var(--plate)}
.mealh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mealh h3{margin:0 0 4px;font-size:20px}.mealh span{color:var(--steel);font-size:14px}.mealh b{color:var(--plate);font:700 20px "Barlow Condensed",sans-serif}
#plan td small{display:block;color:var(--steel);font-size:12px}
#plan td.n,#plan th.n{white-space:nowrap}
@media (max-width:560px){#plan table{font-size:13px}#plan th,#plan td{padding:7px 4px}}
.ok{color:var(--steel);font-size:12px}.off{color:var(--plate);font-size:12px;font-weight:600}

/* install banner */
.install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;max-width:480px;margin:0 auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--plate);border-radius:10px;padding:12px 12px 12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.install img{width:44px;height:44px;border-radius:10px;flex:none}
.install .txt{flex:1;font-size:14px;line-height:1.35}
.install .txt b{display:block;font:600 17px "Barlow Condensed",sans-serif}
.install .go{background:var(--plate);color:var(--on-plate);border:0;border-radius:6px;padding:8px 12px;font:600 16px "Barlow Condensed",sans-serif;cursor:pointer;flex:none}
.install .x{background:none;border:0;color:var(--steel);font-size:22px;line-height:1;padding:4px;cursor:pointer;flex:none}
</style>
</head>
<body>

<div class="install hidden" id="install" role="dialog" aria-label="Add to home screen">
  <img src="/apple-touch-icon.png" alt="">
  <div class="txt"><b>Add Manga Fit to your home screen</b><span id="installMsg">Open it like an app, in one tap.</span></div>
  <button class="go hidden" id="installGo" type="button">Add</button>
  <button class="x" id="installX" type="button" aria-label="Not now">&times;</button>
</div>

<section class="login" id="login">
  <form class="login-card" id="loginForm" novalidate>
    <h1>Body Recomp Program</h1>
    <p>Lose fat, build muscle. 4 training days a week.</p>
    <label for="nm">Name</label>
    <input id="nm" autocomplete="given-name" placeholder="Your name">
    <label for="ag">Age</label>
    <input id="ag" type="number" inputmode="numeric" min="10" max="100" placeholder="Your age">
    <div class="err" id="err" role="alert"></div>
    <button class="btn" type="submit">Start program</button>
  </form>
</section>

<div class="wrap hidden" id="app">
  <header>
    <div><h1 id="hello"></h1><div class="sub" id="who"></div></div>
    <div class="hdr-actions">
      <button class="ghost" id="themeBtn" type="button">Switch theme</button>
      <button class="ghost" id="logout" type="button">Change user</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="ex" aria-selected="true">Exercises</button>
    <button role="tab" data-tab="ins" aria-selected="false">Instructions</button>
    <button role="tab" data-tab="nut" aria-selected="false">Nutrition</button>
  </nav>
  <div id="tab-ex"></div>
  <div id="tab-ins" class="hidden"></div>
  <div id="tab-nut" class="hidden"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const PLAN=[
 {d:"Day 1",t:"Push",ex:[["Flat Bench Press","4–6",3,"90–120 s"],["DB Shoulder Press","8–10",2,"60–90 s"],["Incline DB Press","10–12",4,"60–90 s"],["DB Front Raises","10–12",2,"60–90 s"],["DB Lateral Raises","10–12",2,"60–90 s"],["Chest Flies (Machine)","12–15",3,"60–90 s"],["Cable Triceps Pushdown (rope)","12–15",3,"60–90 s"],["Overhead Triceps Extension (DB / rope)","10–12",3,"60–90 s"],["Shrugs","15",2,"90–120 s"]]},
 {d:"Day 2",t:"Pull + Biceps",ex:[["Lat Pulldown","8–10",3,"60–90 s"],["Rear Delt Flies (Machine)","12–15",3,"60–90 s"],["Wide Grip Row (Machine)","10–12",3,"60–90 s"],["One Arm Row (Machine)","12–15",3,"60–90 s"],["Close Grip Cable Row","8–10",2,"60–90 s"],["Standing DB Curls","10–12",3,"60–90 s"],["Hammer Curls","10–12",3,"60–90 s"],["Lower Back Exercise","12–15",3,"60–90 s"],["DB Romanian Deadlift","10–12",2,"90–120 s"]]},
 {d:"Day 3",t:"Legs + Abs + Arms",ex:[["Barbell Squat (strength)","4–6",3,"90–120 s"],["Leg Press","8–10",3,"60–90 s"],["One-Leg Leg Curls (hamstring)","10–12",2,"60–90 s"],["Leg Extension","12–15",3,"60–90 s"],["Leg Curls","12–15",3,"60–90 s"],["Standing Calf Raises","10–12",3,"60–90 s"],["Crunches","To failure",3,"60–90 s"],["Leg Raises","To failure",3,"60–90 s"],["EZ Bar Curls","10–12",2,"60–90 s"],["Rope Triceps Pushdown","12–15",2,"60–90 s"]]},
 {d:"Day 4",t:"Active rest",rest:"Light walking, mobility drills or stretching."},
 {d:"Day 5",t:"Active rest",rest:"Light walking, mobility drills or stretching."},
 {d:"Day 6",t:"Full body",ex:[["Overhead Barbell Shoulder Press","4–6",2,"90–120 s"],["DB Lateral Raises","10–12",2,"60–90 s"],["Reverse Grip Lat Pulldown","10–12",2,"60–90 s"],["Rear Delt Flies (Machine)","12–15",2,"60–90 s"],["Chest Flies (Machine)","12–15",4,"60–90 s"],["DB Preacher Curls","10–12",3,"60–90 s"],["Reverse Grip Triceps Pushdown","10–12",3,"60–90 s"],["Leg Press","8–10",2,"60–90 s"],["Leg Extension","12–15",2,"60–90 s"],["Leg Curls","12–15",3,"60–90 s"],["Standing Calf Raises","10–12",3,"60–90 s"],["Crunches","To failure",3,"60–90 s"],["Leg Raises","To failure",3,"60–90 s"]],split:7},
 {d:"Day 7",t:"Rest",rest:"Full rest. Sleep well and let your muscles recover."}
];
let day=0;

/* ---------- login ---------- */
function getUser(){try{return JSON.parse(localStorage.getItem("recompUser")||"null");}catch(e){return null;}}
function setUser(u){try{u?localStorage.setItem("recompUser",JSON.stringify(u)):localStorage.removeItem("recompUser");}catch(e){}}
let user=getUser();
$("#loginForm").onsubmit=e=>{
  e.preventDefault();
  const name=$("#nm").value.trim(), age=parseInt($("#ag").value,10);
  if(!name){$("#err").textContent="Enter your name to continue.";$("#nm").focus();return;}
  if(!age||age<10||age>100){$("#err").textContent="Enter an age between 10 and 100.";$("#ag").focus();return;}
  user={name,age}; setUser(user); openApp();
};
$("#logout").onclick=()=>{setUser(null);user=null;$("#nm").value="";$("#ag").value="";$("#err").textContent="";
  $("#app").classList.add("hidden");$("#login").classList.remove("hidden");$("#nm").focus();};
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function openApp(){
  $("#login").classList.add("hidden");$("#app").classList.remove("hidden");
  $("#hello").textContent="Hi, "+user.name;
  $("#who").textContent=`Age ${user.age} · Body recomposition program · 4 training days a week`;
  showTab("ex");
}

/* ---------- tabs ---------- */
function showTab(t){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  ["ex","ins","nut"].forEach(k=>$("#tab-"+k).classList.toggle("hidden",k!==t));
  ({ex:renderEx,ins:renderIns,nut:renderNut})[t]();
}
document.querySelector("nav.tabs").onclick=e=>{const b=e.target.closest("button");if(b)showTab(b.dataset.tab);};

/* ---------- exercises ---------- */
// Start/finish photos from free-exercise-db (public domain), stored in img/ex/.
const EX_IMG={"Flat Bench Press":"Barbell_Bench_Press_-_Medium_Grip","DB Shoulder Press":"Dumbbell_Shoulder_Press","Incline DB Press":"Incline_Dumbbell_Press","DB Front Raises":"Front_Dumbbell_Raise","DB Lateral Raises":"Side_Lateral_Raise","Chest Flies (Machine)":"Butterfly","Cable Triceps Pushdown (rope)":"Triceps_Pushdown_-_Rope_Attachment","Overhead Triceps Extension (DB / rope)":"Cable_Rope_Overhead_Triceps_Extension","Shrugs":"Dumbbell_Shrug","Lat Pulldown":"Wide-Grip_Lat_Pulldown","Rear Delt Flies (Machine)":"Reverse_Machine_Flyes","Wide Grip Row (Machine)":"Leverage_High_Row","One Arm Row (Machine)":"Leverage_Iso_Row","Close Grip Cable Row":"Seated_Cable_Rows","Standing DB Curls":"Dumbbell_Bicep_Curl","Hammer Curls":"Hammer_Curls","Lower Back Exercise":"Hyperextensions_Back_Extensions","DB Romanian Deadlift":"Stiff-Legged_Dumbbell_Deadlift","Barbell Squat (strength)":"Barbell_Squat","Leg Press":"Leg_Press","One-Leg Leg Curls (hamstring)":"Standing_Leg_Curl","Leg Extension":"Leg_Extensions","Leg Curls":"Lying_Leg_Curls","Standing Calf Raises":"Standing_Calf_Raises","Crunches":"Crunches","Leg Raises":"Flat_Bench_Lying_Leg_Raise","EZ Bar Curls":"EZ-Bar_Curl","Rope Triceps Pushdown":"Triceps_Pushdown_-_Rope_Attachment","Overhead Barbell Shoulder Press":"Barbell_Shoulder_Press","Reverse Grip Lat Pulldown":"Underhand_Cable_Pulldowns","DB Preacher Curls":"One_Arm_Dumbbell_Preacher_Curl","Reverse Grip Triceps Pushdown":"Reverse_Grip_Triceps_Pushdown"};
function renderEx(){
  const D=PLAN[day];
  let h='<div class="week">'+PLAN.map((p,i)=>`<button class="dayb${p.rest?' rest':''}" aria-pressed="${i===day}" data-i="${i}"><small>${p.d}</small><b>${p.t}</b></button>`).join("")+'</div>';
  h+='<div class="panel">';
  if(D.rest){ h+=`<h2>${D.d} · ${D.t}</h2><p class="note" style="margin:0">${D.rest}</p>`; }
  else{
    h+=`<h2>${D.d} · ${D.t}</h2><p class="note">Warm up 5–10 min on any machine, then dynamic stretching. Start each exercise with a light set at 50–70% of your working weight. Finish with static stretching, a 5 min cool down and a contrast shower.</p>`;
    D.ex.forEach((e,i)=>{
      if(D.split===i) h+='<div class="group">Lower body and abs</div>';
      h+=`<div class="ex" role="button" tabindex="0" aria-expanded="false" data-n="${esc(e[0])}"><div class="i">${i+1}</div><div class="name">${e[0]}</div>
      <div class="meta"><span class="pill">${e[2]} sets</span><span class="pill">${e[1]} reps</span><span class="pill r">Rest ${e[3]}</span></div></div><div class="shots hidden"></div>`;
    });
  }
  h+='</div>';
  if(!D.rest) h+=`<div class="two"><div class="panel"><h3>Tempo</h3><p style="margin:0 0 4px"><b>4–6 reps:</b> 2 s down, 2 s up.</p><p style="margin:0"><b>8–15 reps:</b> 3–4 s down, 2 s up.</p></div>
  <div class="panel"><h3>Warm-up and dynamic stretch</h3><ul><li>Light cardio on any machine</li><li>Arm swings, 10 reps per side</li><li>Arm circles, 10 reps per side</li><li>Front-to-back leg swings, 10 per side</li><li>Side-to-side leg swings, 10 per side</li><li>Cable external rotation (optional), 15 per side</li></ul></div></div>`;
  $("#tab-ex").innerHTML=h;
  const toggle=row=>{const box=row.nextElementSibling,open=row.getAttribute("aria-expanded")!=="true",id=EX_IMG[row.dataset.n];
    if(open&&!box.innerHTML)box.innerHTML=id?["Start","Finish"].map((t,k)=>`<figure><img src="/img/ex/${id}-${k}.jpg" alt="${row.dataset.n}, ${t.toLowerCase()} position" loading="lazy" width="640" height="427"><figcaption>${t}</figcaption></figure>`).join(""):'<p class="note" style="margin:0">No photo for this exercise yet.</p>';
    row.setAttribute("aria-expanded",open);box.classList.toggle("hidden",!open);};
  $("#tab-ex").onclick=e=>{const b=e.target.closest(".dayb");if(b){day=+b.dataset.i;renderEx();return;}const r=e.target.closest(".ex");if(r)toggle(r);};
  $("#tab-ex").onkeydown=e=>{const r=e.target.closest(".ex");if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();toggle(r);}};
}

/* ---------- instructions ---------- */
function renderIns(){
  const G=[
   ["Warm-up (5–10 min)",["5 min light cardio: treadmill, bike or jump rope","Dynamic stretching: joint rotations, hip circles, arm swings","2–3 lighter warm-up sets at 50–70% of working weight before heavy lifts"]],
   ["Progressive overload",["Increase weight, reps or intensity gradually","Add reps first (e.g. 8 → 10), then add weight","Add 2.5–5 kg every 1–2 weeks on compound lifts","Track your lifts to measure progress"]],
   ["Training intensity",["Week 1: RPE 7–9 (1–3 reps left in the tank)","After week 1: RPE 9–10 (1 rep left, or failure on the last set)","Only go to failure on the last set of isolation exercises"]],
   ["Exercise selection",["Prioritise compounds: squat, deadlift, bench, overhead press, pull-ups, rows","Isolation for weak points: curls, triceps extensions, lateral raises, leg curls","Form first: no ego lifting, controlled reps, full range of motion","Focus on feeling the target muscle work"]],
   ["Rest between sets",["Strength lifts (squat, deadlift, bench): 2–3 min","Hypertrophy compounds: 90–120 s","Isolation: 45–90 s","Shorter rest = more burn, longer rest = more strength"]],
   ["Frequency and volume",["Train each muscle at least 2× per week","10–20 sets per muscle per week","Strength 4–6 reps, hypertrophy 6–12, endurance 12–20"]],
   ["Tempo and control",["Lower the weight in 2–3 s under control","Lift explosively but keep tension on the muscle","No swinging or momentum"]],
   ["Recovery and sleep",["Sleep 7–9 hours a night","Take 1–2 rest days a week","Active recovery: walking, mobility, stretching","Deload every 4–6 weeks: cut weight/intensity by 50% for one week"]],
   ["Cardio",["Bulking: 1–2× a week, 20–30 min light/moderate","Cutting: 3–5× a week, 30–45 min moderate/intense","HIIT: sprint 30 s, walk 60 s × 8 rounds","LISS: steady walking or cycling for 30–45 min"]]
  ];
  const RPE=[[10,"Max effort, no reps left",0],[9,"Could do 1 more rep",1],[8,"Could do 2 more",2],[7,"Could do 3 more",3],[6,"Could do 4 more",4],[5,"Could do 5 more",5]];
  const VOL=[["Chest","14 sets"],["Back (full)","16 + 3 lower back"],["Shoulders","17 sets"],["Hamstrings","10+ sets"],["Quads","11 sets"],["Calves","6 sets"],["Biceps","11+ sets"],["Triceps","11+ sets"],["Abs","12 sets"]];
  let h='<div class="panel"><div class="guide">'+G.map(([t,l])=>`<section><h3>${t}</h3><ul>${l.map(x=>`<li>${x}</li>`).join("")}</ul></section>`).join("")+'</div></div>';
  h+='<div class="two"><div class="panel"><h3>How hard to push (RPE)</h3><div class="tbl-wrap"><table><thead><tr><th class="n">RPE</th><th>Effort</th><th class="n">Reps left</th></tr></thead><tbody>'+RPE.map(r=>`<tr><td class="n">${r[0]}</td><td>${r[1]}</td><td class="n">${r[2]}</td></tr>`).join("")+'</tbody></table></div></div>';
  h+='<div class="panel"><h3>Weekly sets per muscle</h3><div class="tbl-wrap"><table><thead><tr><th>Muscle</th><th>Volume</th></tr></thead><tbody>'+VOL.map(v=>`<tr><td>${v[0]}</td><td>${v[1]}</td></tr>`).join("")+'</tbody></table></div><p class="note" style="margin:8px 0 0">Advanced lifters can add extra sets for weak points on a rest day.</p></div></div>';
  $("#tab-ins").innerHTML=h;
}

/* ---------- nutrition ---------- */
function renderNut(){
  let h=`<div class="panel"><h2>Your daily calories and macros</h2><p class="note">Fill in your details. Age ${user.age} is taken from your login.</p>
  <div class="form">
   <div><label for="kg">Weight (kg)</label><input id="kg" type="number" inputmode="decimal" min="30" max="250" placeholder="e.g. 80"></div>
   <div><label for="cm">Height (cm)</label><input id="cm" type="number" inputmode="decimal" min="120" max="230" placeholder="e.g. 178"></div>
   <div><label for="sex">Sex</label><select id="sex"><option value="m">Male</option><option value="f">Female</option></select></div>
   <div><label for="act">Activity</label><select id="act"><option value="1.2">Little or no exercise</option><option value="1.375">Light (1–3 days/week)</option><option value="1.55" selected>Moderate (3–5 days/week)</option><option value="1.725">Very active (6–7 days/week)</option></select></div>
   <div><label for="goal">Goal</label><select id="goal"><option value="recomp" selected>Body recomp (−300 kcal)</option><option value="cut">Lose fat (−500 kcal)</option><option value="keep">Maintain weight</option><option value="bulk">Build muscle (+300 kcal)</option></select></div>
  </div>
  <div id="res"><p class="note" style="margin:0">Enter your weight and height to see your numbers.</p></div>
  </div>`;
  h+=`<div class="panel" style="margin-top:16px"><h2>Build your diet plan</h2><p class="note">Pick the foods you like. The plan works out how much of each to eat to hit your calories and macros above.</p>
  ${Object.entries(FOODS).map(([k,g])=>`<div class="pick"><h3>${g.label}</h3><div class="chips" data-cat="${k}">${g.items.map(f=>`<button type="button" class="chip" data-id="${f.id}" aria-pressed="false">${f.name}</button>`).join("")}</div></div>`).join("")}
  <div class="form" style="margin-top:6px"><div><label for="meals">Meals a day</label><select id="meals"><option>3</option><option selected>4</option><option>5</option></select></div></div>
  <div id="plan"></div>
  </div>`;
  $("#tab-nut").innerHTML=h;
  const ids=["kg","cm","sex","act","goal"];
  try{const s=JSON.parse(localStorage.getItem("recompMacros")||"{}");ids.forEach(k=>{if(s[k]!=null)$("#"+k).value=s[k];});}catch(e){}
  const calc=()=>{
    const v={};ids.forEach(k=>v[k]=$("#"+k).value);
    try{localStorage.setItem("recompMacros",JSON.stringify(v));}catch(e){}
    const w=parseFloat(v.kg),hcm=parseFloat(v.cm),a=user.age;
    if(!(w>=30&&w<=250&&hcm>=120&&hcm<=230)){$("#res").innerHTML='<p class="note" style="margin:0">Enter your weight and height to see your numbers.</p>';targets=null;renderPlan();return;}
    const bmr=10*w+6.25*hcm-5*a+(v.sex==="m"?5:-161);
    const tdee=bmr*parseFloat(v.act);
    const adj={recomp:-300,cut:-500,keep:0,bulk:300}[v.goal];
    const kcal=Math.round(tdee+adj);
    const pG=Math.round(w*(v.goal==="bulk"||v.goal==="keep"?1.8:2.0));
    const fG=Math.round(kcal*0.25/9);
    const cG=Math.max(0,Math.round((kcal-pG*4-fG*9)/4));
    const pK=pG*4,fK=fG*9,cK=cG*4,tot=pK+fK+cK||1;
    const pct=x=>Math.round(x/tot*100);
    $("#res").innerHTML=`<div class="kcal"><span class="big">${kcal.toLocaleString()}</span><span>kcal a day</span><small class="note" style="margin:0;width:100%">Maintenance is about ${Math.round(tdee).toLocaleString()} kcal${adj?`, adjusted by ${adj>0?'+':''}${adj} for your goal`:''}.</small></div>
    <div class="macros">
     <div class="macro"><small>Protein</small><div class="big">${pG} g</div><small>${pK} kcal · ${pct(pK)}%</small></div>
     <div class="macro"><small>Carbs</small><div class="big">${cG} g</div><small>${cK} kcal · ${pct(cK)}%</small></div>
     <div class="macro"><small>Fats</small><div class="big">${fG} g</div><small>${fK} kcal · ${pct(fK)}%</small></div>
    </div>
    <div class="bar" aria-hidden="true"><span style="width:${pct(pK)}%"></span><span style="width:${pct(cK)}%"></span><span style="width:${pct(fK)}%"></span></div>
    <p class="note" style="margin:10px 0 0">Protein ${v.goal==="bulk"||v.goal==="keep"?'1.8':'2.0'} g per kg (the plan's range is 1.6–2.2), fats 25% of calories, carbs fill the rest. These are estimates. Adjust by 100–200 kcal if your weight isn't moving as planned after 2–3 weeks.</p>`;
    targets={kcal,p:pG,c:cG,f:fG};renderPlan();
  };
  ids.forEach(k=>{$("#"+k).oninput=calc;$("#"+k).onchange=calc;});
  let saved={};try{saved=JSON.parse(localStorage.getItem("recompFoods")||"null")||{};}catch(e){}
  if(!saved.foods)saved={foods:["chicken","rice","olive"],meals:"4"};
  document.querySelectorAll(".chip").forEach(b=>{b.setAttribute("aria-pressed",saved.foods.includes(b.dataset.id));
    b.onclick=()=>{b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");savePlan();renderPlan();};});
  $("#meals").value=saved.meals||"4";$("#meals").onchange=()=>{savePlan();renderPlan();};
  calc();
}
function savePlan(){const foods=[...document.querySelectorAll('.chip[aria-pressed="true"]')].map(b=>b.dataset.id);
  try{localStorage.setItem("recompFoods",JSON.stringify({foods,meals:$("#meals").value}));}catch(e){}}

/* ---------- diet plan ---------- */
// Per 100 g. Cooked weight unless the name says dry. unit = grams in one piece/scoop/spoon.
const FOODS={
 protein:{label:"Protein",main:"p",items:[
  {id:"chicken",name:"Chicken breast",p:31,c:0,f:3.6},
  {id:"turkey",name:"Turkey breast",p:29,c:0,f:2},
  {id:"beef",name:"Lean beef mince",p:26,c:0,f:8},
  {id:"tuna",name:"Tuna (in water)",p:26,c:0,f:1},
  {id:"salmon",name:"Salmon",p:25,c:0,f:12},
  {id:"whitefish",name:"White fish",p:23,c:0,f:1.5},
  {id:"shrimp",name:"Shrimp",p:24,c:0.2,f:0.3},
  {id:"eggs",name:"Whole eggs",p:13,c:1.1,f:11,unit:50,uname:"egg"},
  {id:"whites",name:"Egg whites",p:11,c:0.7,f:0.2},
  {id:"yogurt",name:"Greek yogurt 0%",p:10,c:3.6,f:0.4},
  {id:"cottage",name:"Cottage cheese",p:11,c:3.4,f:1},
  {id:"whey",name:"Whey protein",p:80,c:8,f:6,unit:30,uname:"scoop"}]},
 carbs:{label:"Carbs",main:"c",items:[
  {id:"rice",name:"White rice",p:2.7,c:28,f:0.3},
  {id:"brownrice",name:"Brown rice",p:2.6,c:23,f:0.9},
  {id:"pasta",name:"Pasta",p:5.8,c:31,f:0.9},
  {id:"oats",name:"Oats (dry)",p:13,c:66,f:7},
  {id:"potato",name:"Potatoes",p:2,c:20,f:0.1},
  {id:"sweetpotato",name:"Sweet potato",p:2,c:21,f:0.2},
  {id:"bread",name:"Wholemeal bread",p:13,c:41,f:3.4,unit:35,uname:"slice"},
  {id:"quinoa",name:"Quinoa",p:4.4,c:21,f:1.9},
  {id:"lentils",name:"Lentils",p:9,c:20,f:0.4},
  {id:"banana",name:"Banana",p:1.1,c:23,f:0.3,unit:120,uname:"banana"},
  {id:"dates",name:"Dates",p:2.5,c:75,f:0.4,unit:8,uname:"date"}]},
 fats:{label:"Fats",main:"f",items:[
  {id:"olive",name:"Olive oil",p:0,c:0,f:100,unit:13.5,uname:"tbsp"},
  {id:"avocado",name:"Avocado",p:2,c:9,f:15},
  {id:"almonds",name:"Almonds",p:21,c:22,f:50},
  {id:"walnuts",name:"Walnuts",p:15,c:14,f:65},
  {id:"pb",name:"Peanut butter",p:25,c:20,f:50,unit:16,uname:"tbsp"},
  {id:"tahini",name:"Tahini",p:17,c:21,f:54,unit:15,uname:"tbsp"},
  {id:"cheese",name:"Cheddar cheese",p:25,c:1.3,f:33},
  {id:"butter",name:"Butter",p:0.9,c:0.1,f:81}]}
};
// Which meals each food suits. Foods with no tag for a meal are still used there if nothing else in that group fits.
const MEAL_TAGS={b:"eggs whites yogurt cottage whey oats bread banana dates olive avocado pb cheese butter tahini",
 m:"chicken turkey beef tuna salmon whitefish shrimp eggs rice brownrice pasta potato sweetpotato quinoa lentils bread olive avocado cheese butter tahini",
 s:"whey yogurt cottage eggs tuna oats bread banana dates almonds walnuts pb"};
const MEAL_LAYOUT={3:[["Breakfast","b",1],["Lunch","m",1],["Dinner","m",1]],
 4:[["Breakfast","b",1],["Lunch","m",1],["Snack","s",.5],["Dinner","m",1]],
 5:[["Breakfast","b",1],["Snack","s",.5],["Lunch","m",1],["Snack","s",.5],["Dinner","m",1]]};
const FOOD_BY_ID={};Object.values(FOODS).forEach(g=>g.items.forEach(f=>FOOD_BY_ID[f.id]=f));
let targets=null;

// Solve A x = b (small square system) by Gaussian elimination; null if singular.
function solve(A,b){const n=b.length,M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;
    if(Math.abs(M[p][c])<1e-9)return null;[M[c],M[p]]=[M[p],M[c]];
    for(let r=0;r<n;r++)if(r!==c){const k=M[r][c]/M[c][c];for(let j=c;j<=n;j++)M[r][j]-=k*M[c][j];}}
  return M.map((r,i)=>r[n]/r[i]);}

// Grams of each food so the picked foods hit target t. Each group (protein/carbs/fats) is a blend whose
// foods share that group's main macro equally; a group whose amount comes out negative is dropped.
function fitFoods(ids,t){
  const blends=Object.values(FOODS).map(g=>{
    const foods=g.items.filter(f=>ids.includes(f.id));if(!foods.length)return null;
    const per={p:0,c:0,f:0},grams={}; // macros and grams per 1 g of the main macro
    foods.forEach(f=>{const gr=(1/foods.length)/(f[g.main]/100);grams[f.id]=gr;["p","c","f"].forEach(m=>per[m]+=gr*f[m]/100);});
    return {main:g.main,per,grams};});
  let act=blends.map((b,i)=>b?i:-1).filter(i=>i>=0);
  while(act.length){const A=act.map(r=>act.map(c=>blends[c].per[blends[r].main])),bb=act.map(r=>t[blends[r].main]);
    const sol=solve(A,bb);if(!sol){act.pop();continue;}
    const neg=sol.reduce((m,v,i)=>v<sol[m]?i:m,0);
    if(sol[neg]>=0){const out={};act.forEach((c,i)=>Object.entries(blends[c].grams).forEach(([id,gr])=>out[id]=(out[id]||0)+gr*sol[i]));return out;}
    act.splice(neg,1);}
  return null;}

function renderPlan(){
  const out=$("#plan");if(!out)return;
  if(!targets){out.innerHTML='<p class="note" style="margin:12px 0 0">Enter your weight and height above to build your plan.</p>';return;}
  const chosen=[...document.querySelectorAll('.chip[aria-pressed="true"]')].map(b=>b.dataset.id);
  if(!FOODS.protein.items.some(f=>chosen.includes(f.id))){out.innerHTML='<p class="note" style="margin:12px 0 0">Pick at least one protein food.</p>';return;}
  const layout=MEAL_LAYOUT[$("#meals").value],wsum=layout.reduce((a,m)=>a+m[2],0),seen={};
  const r5=v=>Math.round(v/5)*5,mac=(f,g)=>({p:g*f.p/100,c:g*f.c/100,f:g*f.f/100}),kc=o=>o.p*4+o.c*4+o.f*9;
  // Meals are filled in order. Each gets its share of what is still left of the day's targets, so a meal
  // that runs over is made up for by the ones after it. It uses the picked foods that suit it, alternating
  // between them on repeated meal types (lunch/dinner, snacks); if those miss the target, it tries adding
  // one more picked food and keeps whichever lands closer.
  const left={...targets};let wleft=wsum;
  const meals=layout.map(([name,tag,w])=>{
    const k=seen[tag]=(seen[tag]||0)+1,n=layout.filter(m=>m[1]===tag).length;
    const pref=[],all=[];Object.values(FOODS).forEach(g=>{
      const mine=g.items.filter(f=>chosen.includes(f.id)),fit=mine.filter(f=>MEAL_TAGS[tag].split(" ").includes(f.id)),pool=fit.length?fit:mine;
      const use=n>1&&pool.length>1?pool.filter((f,i)=>i%n===(k-1)%n||(pool.length<n&&i===(k-1)%pool.length)):pool;
      (use.length?use:pool).forEach(f=>pref.push(f.id));mine.forEach(f=>all.push(f.id));});
    const t={p:Math.max(0,left.p*w/wleft),c:Math.max(0,left.c*w/wleft),f:Math.max(0,left.f*w/wleft)};
    const build=ids=>{const g=fitFoods(ids,t)||{};
      const items=Object.entries(g).map(([id,gr])=>({food:FOOD_BY_ID[id],g:r5(gr)})).filter(x=>x.g>0).map(x=>({...x,...mac(x.food,x.g)}));
      const tot=items.reduce((a,x)=>({p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{p:0,c:0,f:0});
      return {items,tot,err:Math.abs(tot.p-t.p)*4+Math.abs(tot.c-t.c)*4+Math.abs(tot.f-t.f)*9};};
    // Cost = distance from target plus a small charge per item, so meals stay short.
    const cost=m=>m.err+m.items.length*kc(t)*0.015;
    let best=build(pref);if(best.err>kc(t)*0.05)all.filter(id=>!pref.includes(id)).forEach(id=>{const alt=build([...pref,id]);if(cost(alt)<cost(best))best=alt;});
    ["p","c","f"].forEach(m=>left[m]-=best.tot[m]);wleft-=w;
    return {name,items:best.items,tot:best.tot};});
  const day=meals.reduce((a,m)=>({p:a.p+m.tot.p,c:a.c+m.tot.c,f:a.f+m.tot.f}),{p:0,c:0,f:0});
  const R=Math.round,unit=(f,g)=>{if(!f.unit)return"";const n=R(g/f.unit*2)/2;return n>0?`<small>≈ ${n} ${f.uname}${n>1&&f.uname!=="tbsp"?"s":""}</small>`:"";};
  const diff=(a,t,u)=>{const d=R(a-t);return Math.abs(d)<=Math.max(5,t*0.05)?'<span class="ok" title="On target">✓</span>':`<span class="off">${d>0?"+":""}${d}${u}</span>`;};
  const head='<thead><tr><th>Food</th><th class="n">Amount</th><th class="n">P</th><th class="n">C</th><th class="n">F</th><th class="n">kcal</th></tr></thead>';
  out.innerHTML=`<p class="note" style="margin:14px 0 6px">P = protein, C = carbs, F = fats, all in grams.</p>
  ${meals.map((m,i)=>`<div class="mealc"><div class="mealh"><h3>Meal ${i+1} · ${m.name}</h3><span><b>${R(kc(m.tot))}</b> kcal</span></div>
   <div class="tbl-wrap"><table>${head}<tbody>
   ${m.items.map(x=>`<tr><td>${x.food.name}${unit(x.food,x.g)}</td><td class="n">${x.g} g</td><td class="n">${R(x.p)}</td><td class="n">${R(x.c)}</td><td class="n">${R(x.f)}</td><td class="n">${R(kc(x))}</td></tr>`).join("")}
   <tr class="totr"><td>Meal total</td><td></td><td class="n">${R(m.tot.p)}</td><td class="n">${R(m.tot.c)}</td><td class="n">${R(m.tot.f)}</td><td class="n">${R(kc(m.tot))}</td></tr>
   </tbody></table></div></div>`).join("")}
  <div class="mealc day"><div class="mealh"><h3>Whole day</h3><span><b>${R(kc(day))}</b> kcal</span></div>
   <div class="tbl-wrap"><table><thead><tr><th></th><th class="n">Protein</th><th class="n">Carbs</th><th class="n">Fats</th><th class="n">kcal</th></tr></thead><tbody>
   <tr><td>Your meals</td><td class="n">${R(day.p)} g</td><td class="n">${R(day.c)} g</td><td class="n">${R(day.f)} g</td><td class="n">${R(kc(day))}</td></tr>
   <tr><td>Your target</td><td class="n">${targets.p} g</td><td class="n">${targets.c} g</td><td class="n">${targets.f} g</td><td class="n">${targets.kcal}</td></tr>
   <tr><td></td><td class="n">${diff(day.p,targets.p," g")}</td><td class="n">${diff(day.c,targets.c," g")}</td><td class="n">${diff(day.f,targets.f," g")}</td><td class="n">${diff(kc(day),targets.kcal,"")}</td></tr>
   </tbody></table></div></div>
  <p class="note" style="margin:10px 0 0">Weigh food cooked, except oats (dry). Add vegetables to any meal; they aren't counted. If a number is orange, the foods you picked carry too much of that macro (for example salmon or eggs add fat), so swap one food or pick another.</p>`;
}
