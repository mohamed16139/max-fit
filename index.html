<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body Recomp Program</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0B0B0B">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Manga Fit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#0B0B0B; --card:#161616; --ink:#F2F2F2; --steel:#A3A3A3; --line:#2A2A2A;
  --plate:#FF7A1A; --plate-soft:#3A2210; --blue-soft:#242424; --on-plate:#111111;
  --bar2:#FFB570; --bar3:#6B6B6B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--paper:#F5F5F5; --card:#FFFFFF; --ink:#111111; --steel:#5E5E5E; --line:#DDDDDD; --plate:#E85D00; --plate-soft:#FFE3CC; --blue-soft:#EEEEEE; --on-plate:#111111; --bar2:#FFB570; --bar3:#9A9A9A;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 15px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.hidden{display:none!important}
button:focus-visible,input:focus-visible{outline:2px solid var(--plate);outline-offset:2px}

/* login */
.login{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px;border-top:6px solid var(--plate)}
.login h1{font-size:40px;line-height:1;margin:0 0 6px}
.login p{margin:0 0 20px;color:var(--steel)}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px}
.err{color:var(--plate);font-size:14px;min-height:20px;margin:-4px 0 10px}
.btn{width:100%;font:600 18px "Barlow Condensed",sans-serif;background:var(--plate);color:var(--on-plate);border:0;border-radius:8px;padding:12px;cursor:pointer;letter-spacing:.3px}

/* program chooser */
.choose .wrap{max-width:1000px}
.choose h1{font-size:40px;line-height:1;margin:8px 0 4px}
.progs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:18px 0 14px}
.prog{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column}
.prog.cur{border-top-color:var(--plate)}
.progh{display:flex;align-items:center;gap:8px}.prog h2{margin:0;font-size:28px}
.progm{display:flex;gap:6px;margin:8px 0}
.prog p{margin:0 0 10px;color:var(--steel);font-size:14px}
.progd{list-style:none;padding:0;margin:0 0 14px;flex:1}
.progd li{display:flex;gap:10px;padding:4px 0;border-top:1px solid var(--line);font-size:14px}
.progd li b{color:var(--plate);width:14px;text-align:right;font-family:"Barlow Condensed",sans-serif}
.progd li.rd{color:var(--steel)}.progd li.rd b{color:var(--steel)}
#chooseBack{width:100%;padding:12px}

/* app */
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
header h1{font-size:40px;line-height:1;margin:0}
.sub{color:var(--steel);margin-top:4px}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;font:600 18px "Barlow Condensed",sans-serif;color:var(--steel);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--plate)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.dayb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;font:inherit}
.dayb small{display:block;color:var(--steel);font-size:12px}
.dayb b{font:600 17px "Barlow Condensed",sans-serif}
.dayb.rest{background:transparent}
.dayb[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.dayb[aria-pressed="true"] small{color:inherit;opacity:.75}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{margin:0 0 4px;font-size:28px}
.note{font-size:14px;color:var(--steel);margin:0 0 12px}
.ex{display:grid;grid-template-columns:34px 1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .i{font:700 20px "Barlow Condensed",sans-serif;color:var(--plate);text-align:center}
.ex .name{font:600 16px Barlow,system-ui,sans-serif;color:var(--ink);background:none;border:0;padding:4px 0;text-align:left;cursor:pointer}
.ex .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:var(--blue-soft);border-radius:4px;padding:2px 8px;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.r{background:var(--plate-soft)}
.group{font:600 15px "Barlow Condensed",sans-serif;color:var(--steel);margin:14px 0 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:16px}
.panel h3{font-size:21px;margin:0 0 6px}
ul{margin:0;padding-left:18px} li{margin:3px 0}
.guide{columns:2 320px;column-gap:28px}
.guide section{break-inside:avoid;margin-bottom:18px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{color:var(--steel);font-weight:600;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.calc{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.calc input{width:140px;margin:0}
.big{font:700 34px "Barlow Condensed",sans-serif;line-height:1.1}
select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.kcal{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
.kcal .big{font-size:44px;color:var(--plate)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.macro{background:var(--paper);border-radius:8px;padding:10px 12px}
.macro .big{font-size:30px}
.macro small{display:block;color:var(--steel);font-size:13px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:12px}
.bar span:nth-child(1){background:var(--plate)}.bar span:nth-child(2){background:var(--bar2)}.bar span:nth-child(3){background:var(--bar3)}
@media (max-width:560px){.macros{gap:6px}.macro{padding:8px}.macro .big{font-size:24px}.kcal .big{font-size:38px}}
@media (max-width:760px){.week{grid-template-columns:repeat(4,1fr)}}
@media (max-width:560px){
  .wrap{padding:14px 12px 40px}
  header h1{font-size:32px}
  .hdr-actions{width:100%}.hdr-actions .ghost{flex:1;padding:9px 10px}
  nav.tabs button{flex:1;padding:10px 6px;font-size:17px}
  .week{grid-template-columns:repeat(3,1fr)}
  .dayb{padding:8px}.dayb b{font-size:16px}
  .panel{padding:14px 12px}.panel h2{font-size:24px}
  .ex{grid-template-columns:28px 1fr}.ex .meta{grid-column:2;justify-content:flex-start}
  .two{grid-template-columns:1fr}
  .calc input{width:100%}.calc>div{flex:1 1 140px}
}

/* exercise photos */
.ex .name::after{content:"";display:inline-block;width:7px;height:7px;margin-left:8px;border-right:2px solid var(--steel);border-bottom:2px solid var(--steel);transform:translateY(-3px) rotate(45deg);transition:transform .15s}
.ex .name[aria-expanded="true"]::after{transform:translateY(0) rotate(-135deg)}
.ex .name:focus-visible{outline:2px solid var(--plate);outline-offset:2px;border-radius:4px}
.exlog{grid-column:2/-1}
.setpick{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.setb{border:1px solid var(--line);background:var(--paper);color:var(--steel);border-radius:999px;padding:4px 10px;font:500 13px Barlow,system-ui,sans-serif;cursor:pointer}
.setb.ok{color:var(--ink);border-color:var(--plate-soft);background:var(--plate-soft)}
.setb[aria-pressed="true"]{background:var(--plate);border-color:var(--plate);color:var(--on-plate);font-weight:600}
.ex.done .i{color:var(--steel)}
.donetag{display:inline-block;margin-left:6px;background:var(--plate);color:var(--on-plate);border-radius:4px;padding:0 6px;font:600 13px "Barlow Condensed",sans-serif;vertical-align:2px}
.dayh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.daytag{font-size:14px;color:var(--steel)}.daytag.all{color:var(--plate);font-weight:600}
.set b{font-size:11px;color:var(--steel)}
.sets.locked .set{padding-right:8px}
.editb{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--line);color:var(--steel);border-radius:6px;padding:3px 9px;font:500 13px Barlow,system-ui,sans-serif;cursor:pointer;margin-left:auto}
.editb:hover{color:var(--plate);border-color:var(--plate)}
.editb.done-ed{margin-top:8px}
.setf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.setf input{width:72px;margin:0;padding:7px 8px;font-size:16px;text-align:center}
.setf .x{color:var(--steel);font-size:14px}
.logb{background:none;border:1px solid var(--plate);color:var(--plate);border-radius:6px;padding:7px 12px;font:600 15px "Barlow Condensed",sans-serif;cursor:pointer}
.logb:hover{background:var(--plate);color:var(--on-plate)}
.sets{font-size:13px;color:var(--steel);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.set{background:var(--plate-soft);color:var(--ink);border-radius:4px;padding:1px 2px 1px 8px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center}
.setx{background:none;border:0;color:var(--steel);cursor:pointer;font-size:15px;line-height:1;padding:2px 6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bwrow{display:flex;gap:8px;align-items:center}.bwrow input{margin:0;max-width:130px}.bwrow span{color:var(--steel)}
.bwrow .btn{width:auto;padding:9px 18px;font-size:16px}
table.lifts td small{display:block;color:var(--steel);font-size:12px}
table.lifts tr[data-ex]{cursor:pointer}table.lifts tr.sel td{background:var(--plate-soft)}
table.lifts .lk{background:none;border:0;padding:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;font-weight:600}
td.up{color:var(--plate);font-weight:600}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 12px}
.shots figure{margin:0}
.shots img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:8px;background:var(--paper)}
.shots figcaption{font-size:12px;color:var(--steel);margin-top:4px}

/* progress */
.logf{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 12px;align-items:end}
.logf .btn{margin-bottom:14px;padding:10px 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stats.three{grid-template-columns:repeat(3,1fr)}
.stats .big{font-size:24px}
.chart{position:relative}.chart svg{display:block;touch-action:pan-y}
.chart .gl{stroke:var(--line);stroke-width:1}.chart .ax{fill:var(--steel);font-size:11px;font-family:Barlow,system-ui,sans-serif}
.chart .ln{fill:none;stroke:var(--plate);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--plate);stroke:var(--card);stroke-width:2}
.chart .goal{stroke:var(--steel);stroke-width:1.5;stroke-dasharray:4 4}
.chart .xh{stroke:var(--steel);stroke-width:1}.chart .hl{fill:var(--plate);stroke:var(--card);stroke-width:2}
.chart .tip{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:var(--card);border-radius:6px;padding:5px 9px;font-size:13px;line-height:1.3;pointer-events:none;white-space:nowrap;text-align:center}
.goalrow{display:flex;gap:10px;align-items:center;margin-top:12px}.goalrow label{margin:0;white-space:nowrap}.goalrow input{margin:0;max-width:160px}
.hist{margin-top:12px}.hist summary{cursor:pointer;color:var(--steel);font-size:14px;padding:4px 0}
.del{background:none;border:0;color:var(--steel);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px}.del:hover{color:var(--plate)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr);gap:6px}.stats.three{grid-template-columns:repeat(3,1fr)}.stats .big{font-size:20px}nav.tabs button{font-size:16px;padding:10px 4px}}

/* diet plan */
.pick h3{font-size:19px;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.chip[aria-pressed="true"]{background:var(--plate);color:var(--on-plate);border-color:var(--plate);font-weight:600}
.meal{list-style:none;padding:0;margin:0 0 12px}.meal li{padding:6px 0;border-bottom:1px solid var(--line)}
.totr td{font-weight:600;border-top:2px solid var(--line)}
.mealc{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--paper)}
.mealc.day{border-color:var(--plate)}
.mealh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mealh h3{margin:0 0 4px;font-size:20px}.mealh span{color:var(--steel);font-size:14px}.mealh b{color:var(--plate);font:700 20px "Barlow Condensed",sans-serif}
#plan td small{display:block;color:var(--steel);font-size:12px}
#plan td.n,#plan th.n{white-space:nowrap}
@media (max-width:560px){#plan table{font-size:13px}#plan th,#plan td{padding:7px 4px}}
.ok{color:var(--steel);font-size:12px}.off{color:var(--plate);font-size:12px;font-weight:600}

/* install banner */
.install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;max-width:480px;margin:0 auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--plate);border-radius:10px;padding:12px 12px 12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.install img{width:44px;height:44px;border-radius:10px;flex:none}
.install .txt{flex:1;font-size:14px;line-height:1.35}
.install .txt b{display:block;font:600 17px "Barlow Condensed",sans-serif}
.install .go{background:var(--plate);color:var(--on-plate);border:0;border-radius:6px;padding:8px 12px;font:600 16px "Barlow Condensed",sans-serif;cursor:pointer;flex:none}
.install .x{background:none;border:0;color:var(--steel);font-size:22px;line-height:1;padding:4px;cursor:pointer;flex:none}
</style>
</head>
<body>

<div class="install hidden" id="install" role="dialog" aria-label="Add to home screen">
  <img src="/apple-touch-icon.png" alt="">
  <div class="txt"><b>Add Manga Fit to your home screen</b><span id="installMsg">Open it like an app, in one tap.</span></div>
  <button class="go hidden" id="installGo" type="button">Add</button>
  <button class="x" id="installX" type="button" aria-label="Not now">&times;</button>
</div>

<section class="login" id="login">
  <form class="login-card" id="loginForm" novalidate>
    <h1>Body Recomp Program</h1>
    <p>Lose fat, build muscle. Pick a training plan next.</p>
    <label for="nm">Name</label>
    <input id="nm" autocomplete="given-name" placeholder="Your name">
    <label for="ag">Age</label>
    <input id="ag" type="number" inputmode="numeric" min="10" max="100" placeholder="Your age">
    <div class="err" id="err" role="alert"></div>
    <button class="btn" type="submit">Continue</button>
  </form>
</section>

<section class="choose hidden" id="choose" aria-labelledby="chooseH">
  <div class="wrap">
    <h1 id="chooseH">Choose your program</h1>
    <p class="sub" id="chooseSub">Pick the plan that fits your week. You can switch any time.</p>
    <div class="progs" id="progs"></div>
    <button class="ghost hidden" id="chooseBack" type="button">Keep my current program</button>
  </div>
</section>

<div class="wrap hidden" id="app">
  <header>
    <div><h1 id="hello"></h1><div class="sub" id="who"></div></div>
    <div class="hdr-actions">
      <button class="ghost" id="themeBtn" type="button">Switch theme</button>
      <button class="ghost" id="progBtn" type="button">Program</button>
      <button class="ghost" id="logout" type="button">Change user</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="ex" aria-selected="true">Exercises</button>
    <button role="tab" data-tab="ins" aria-selected="false">Instructions</button>
    <button role="tab" data-tab="nut" aria-selected="false">Nutrition</button>
    <button role="tab" data-tab="pro" aria-selected="false">Progress</button>
  </nav>
  <div id="tab-ex"></div>
  <div id="tab-ins" class="hidden"></div>
  <div id="tab-nut" class="hidden"></div>
  <div id="tab-pro" class="hidden"></div>
</div>

<script>
const $=s=>document.querySelector(s);
// Each program is a 7-day week. Exercise rows: [name, reps, sets, rest].
const PROGRAMS={
 recomp:{name:"Body Recomp",days:4,level:"Intermediate",about:"Push, pull and legs plus a full-body day. Built to lose fat and build muscle at the same time.",plan:[
 {d:"Day 1",t:"Push",ex:[["Flat Bench Press","4–6",3,"90–120 s"],["DB Shoulder Press","8–10",2,"60–90 s"],["Incline DB Press","10–12",4,"60–90 s"],["DB Front Raises","10–12",2,"60–90 s"],["DB Lateral Raises","10–12",2,"60–90 s"],["Chest Flies (Machine)","12–15",3,"60–90 s"],["Cable Triceps Pushdown (rope)","12–15",3,"60–90 s"],["Overhead Triceps Extension (DB / rope)","10–12",3,"60–90 s"],["Shrugs","15",2,"90–120 s"]]},
 {d:"Day 2",t:"Pull + Biceps",ex:[["Lat Pulldown","8–10",3,"60–90 s"],["Rear Delt Flies (Machine)","12–15",3,"60–90 s"],["Wide Grip Row (Machine)","10–12",3,"60–90 s"],["One Arm Row (Machine)","12–15",3,"60–90 s"],["Close Grip Cable Row","8–10",2,"60–90 s"],["Standing DB Curls","10–12",3,"60–90 s"],["Hammer Curls","10–12",3,"60–90 s"],["Lower Back Exercise","12–15",3,"60–90 s"],["DB Romanian Deadlift","10–12",2,"90–120 s"]]},
 {d:"Day 3",t:"Legs + Abs + Arms",ex:[["Barbell Squat (strength)","4–6",3,"90–120 s"],["Leg Press","8–10",3,"60–90 s"],["One-Leg Leg Curls (hamstring)","10–12",2,"60–90 s"],["Leg Extension","12–15",3,"60–90 s"],["Leg Curls","12–15",3,"60–90 s"],["Standing Calf Raises","10–12",3,"60–90 s"],["Crunches","To failure",3,"60–90 s"],["Leg Raises","To failure",3,"60–90 s"],["EZ Bar Curls","10–12",2,"60–90 s"],["Rope Triceps Pushdown","12–15",2,"60–90 s"]]},
 {d:"Day 4",t:"Active rest",rest:"Light walking, mobility drills or stretching."},
 {d:"Day 5",t:"Active rest",rest:"Light walking, mobility drills or stretching."},
 {d:"Day 6",t:"Full body",ex:[["Overhead Barbell Shoulder Press","4–6",2,"90–120 s"],["DB Lateral Raises","10–12",2,"60–90 s"],["Reverse Grip Lat Pulldown","10–12",2,"60–90 s"],["Rear Delt Flies (Machine)","12–15",2,"60–90 s"],["Chest Flies (Machine)","12–15",4,"60–90 s"],["DB Preacher Curls","10–12",3,"60–90 s"],["Reverse Grip Triceps Pushdown","10–12",3,"60–90 s"],["Leg Press","8–10",2,"60–90 s"],["Leg Extension","12–15",2,"60–90 s"],["Leg Curls","12–15",3,"60–90 s"],["Standing Calf Raises","10–12",3,"60–90 s"],["Crunches","To failure",3,"60–90 s"],["Leg Raises","To failure",3,"60–90 s"]],split:7},
 {d:"Day 7",t:"Rest",rest:"Full rest. Sleep well and let your muscles recover."}

// Solve A x = b (small square system) by Gaussian elimination; null if singular.
function solve(A,b){const n=b.length,M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;
    if(Math.abs(M[p][c])<1e-9)return null;[M[c],M[p]]=[M[p],M[c]];
    for(let r=0;r<n;r++)if(r!==c){const k=M[r][c]/M[c][c];for(let j=c;j<=n;j++)M[r][j]-=k*M[c][j];}}
  return M.map((r,i)=>r[n]/r[i]);}

// Grams of each food so the picked foods hit target t. Each group (protein/carbs/fats) is a blend whose
// foods share that group's main macro equally; a group whose amount comes out negative is dropped.
function fitFoods(ids,t){
  const blends=Object.values(FOODS).map(g=>{
    const foods=g.items.filter(f=>ids.includes(f.id));if(!foods.length)return null;
    const per={p:0,c:0,f:0},grams={}; // macros and grams per 1 g of the main macro
    foods.forEach(f=>{const gr=(1/foods.length)/(f[g.main]/100);grams[f.id]=gr;["p","c","f"].forEach(m=>per[m]+=gr*f[m]/100);});
    return {main:g.main,per,grams};});
  let act=blends.map((b,i)=>b?i:-1).filter(i=>i>=0);
  while(act.length){const A=act.map(r=>act.map(c=>blends[c].per[blends[r].main])),bb=act.map(r=>t[blends[r].main]);
    const sol=solve(A,bb);if(!sol){act.pop();continue;}
    const neg=sol.reduce((m,v,i)=>v<sol[m]?i:m,0);
    if(sol[neg]>=0){const out={};act.forEach((c,i)=>Object.entries(blends[c].grams).forEach(([id,gr])=>out[id]=(out[id]||0)+gr*sol[i]));return out;}
    act.splice(neg,1);}
  return null;}

function renderPlan(){
  const out=$("#plan");if(!out)return;
  if(!targets){out.innerHTML='<p class="note" style="margin:12px 0 0">Enter your weight and height above to build your plan.</p>';return;}
  const chosen=[...document.querySelectorAll('.chip[aria-pressed="true"]')].map(b=>b.dataset.id);
  if(!FOODS.protein.items.some(f=>chosen.includes(f.id))){out.innerHTML='<p class="note" style="margin:12px 0 0">Pick at least one protein food.</p>';return;}
  const layout=MEAL_LAYOUT[$("#meals").value],wsum=layout.reduce((a,m)=>a+m[2],0),seen={};
  const r5=v=>Math.round(v/5)*5,mac=(f,g)=>({p:g*f.p/100,c:g*f.c/100,f:g*f.f/100}),kc=o=>o.p*4+o.c*4+o.f*9;
  // Meals are filled in order. Each gets its share of what is still left of the day's targets, so a meal
  // that runs over is made up for by the ones after it. It uses the picked foods that suit it, alternating
  // between them on repeated meal types (lunch/dinner, snacks); if those miss the target, it tries adding
  // one more picked food and keeps whichever lands closer.
  const left={...targets};let wleft=wsum;
  const meals=layout.map(([name,tag,w])=>{
    const k=seen[tag]=(seen[tag]||0)+1,n=layout.filter(m=>m[1]===tag).length;
    const pref=[],all=[];Object.values(FOODS).forEach(g=>{
      const mine=g.items.filter(f=>chosen.includes(f.id)),fit=mine.filter(f=>MEAL_TAGS[tag].split(" ").includes(f.id)),pool=fit.length?fit:mine;
      const use=n>1&&pool.length>1?pool.filter((f,i)=>i%n===(k-1)%n||(pool.length<n&&i===(k-1)%pool.length)):pool;
      (use.length?use:pool).forEach(f=>pref.push(f.id));mine.forEach(f=>all.push(f.id));});
    const t={p:Math.max(0,left.p*w/wleft),c:Math.max(0,left.c*w/wleft),f:Math.max(0,left.f*w/wleft)};
    const build=ids=>{const g=fitFoods(ids,t)||{};
      const items=Object.entries(g).map(([id,gr])=>({food:FOOD_BY_ID[id],g:r5(gr)})).filter(x=>x.g>0).map(x=>({...x,...mac(x.food,x.g)}));
      const tot=items.reduce((a,x)=>({p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{p:0,c:0,f:0});
      return {items,tot,err:Math.abs(tot.p-t.p)*4+Math.abs(tot.c-t.c)*4+Math.abs(tot.f-t.f)*9};};

    ["p","c","f"].forEach(m=>left[m]-=best.tot[m]);wleft-=w;
    return {name,items:best.items,tot:best.tot};});
  const day=meals.reduce((a,m)=>({p:a.p+m.tot.p,c:a.c+m.tot.c,f:a.f+m.tot.f}),{p:0,c:0,f:0});
  const R=Math.round,unit=(f,g)=>{if(!f.unit)return"";const n=R(g/f.unit*2)/2;return n>0?`<small>≈ ${n} ${f.uname}${n>1&&f.uname!=="tbsp"?"s":""}</small>`:"";};
  const diff=(a,t,u)=>{const d=R(a-t);return Math.abs(d)<=Math.max(5,t*0.05)?'<span class="ok" title="On target">✓</span>':`<span class="off">${d>0?"+":""}${d}${u}</span>`;};

  out.innerHTML=`<p class="note" style="margin:14px 0 6px">P = protein, C = carbs, F = fats, all in grams.</p>
  ${meals.map((m,i)=>`<div class="mealc"><div class="mealh"><h3>Meal ${i+1} · ${m.name}</h3><span><b>${R(kc(m.tot))}</b> kcal</span></div>

   ${m.items.map(x=>`<tr><td>${x.food.name}${unit(x.food,x.g)}</td><td class="n">${x.g} g</td><td class="n">${R(x.p)}</td><td class="n">${R(x.c)}</td><td class="n">${R(x.f)}</td><td class="n">${R(kc(x))}</td></tr>`).join("")}
   <tr class="totr"><td>Meal total</td><td></td><td class="n">${R(m.tot.p)}</td><td class="n">${R(m.tot.c)}</td><td class="n">${R(m.tot.f)}</td><td class="n">${R(kc(m.tot))}</td></tr>

function lineChart(el,pts,unit,goal){
  const W=Math.max(260,el.clientWidth),H=210,L=40,R=12,T=12,B=26;

  let lo=Math.min(...pts.map(p=>p.v),goal??Infinity),hi=Math.max(...pts.map(p=>p.v),goal??-Infinity);
  const pad=Math.max((hi-lo)*0.15,1);lo-=pad;hi+=pad;
  const step=[0.5,1,2,2.5,5,10,20,25,50,100].find(s=>(hi-lo)/s<=5)||100;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const x=v=>t1===t0?L+(W-L-R)/2:L+(v-t0)/(t1-t0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);

  xs.forEach(i=>g+=`<text x="${x(t[i])}" y="${H-6}" text-anchor="${pts.length>1?(i?"end":"start"):"middle"}" class="ax">${fmtD(pts[i].d)}</text>`);
  if(goal!=null)g+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" class="goal"/><text x="${W-R}" y="${y(goal)-5}" text-anchor="end" class="ax">Goal ${kgf(goal)}</text>`;
  const path=pts.map((p,i)=>(i?"L":"M")+x(t[i]).toFixed(1)+" "+y(p.v).toFixed(1)).join("");

  el.innerHTML=`<div class="chart"><svg width="${W}" height="${H}" role="img" aria-label="${pts.length} entries, latest ${kgf(pts[pts.length-1].v)} ${unit}">${g}<path d="${path}" class="ln"/>${dots}<line class="xh hidden" y1="${T}" y2="${H-B}"/><circle class="hl hidden" r="6"/></svg><div class="tip hidden"></div></div>`;
  const svg=el.querySelector("svg"),xh=svg.querySelector(".xh"),hl=svg.querySelector(".hl"),tip=el.querySelector(".tip");
  const show=e=>{const r=svg.getBoundingClientRect(),mx=e.clientX-r.left;let i=0;t.forEach((v,k)=>{if(Math.abs(x(v)-mx)<Math.abs(x(t[i])-mx))i=k;});

    [xh,hl,tip].forEach(n=>n.classList.remove("hidden"));};
  svg.onpointermove=show;svg.onpointerdown=show;svg.onpointerleave=()=>[xh,hl,tip].forEach(n=>n.classList.add("hidden"));
}

  const tw=P.w.find(x=>x.d===today());
  let h=`<div class="panel"><h2>Body weight</h2>
  <form class="bwrow" id="bwForm"><label class="sr" for="bwKg">Today's weight in kg</label><input id="bwKg" type="number" inputmode="decimal" step="0.1" min="30" max="250" placeholder="${last?kgf(last.kg):"Today's weight"}" value="${tw?tw.kg:""}"><span>kg</span><button class="btn" type="submit">${tw?"Update today":"Save today"}</button></form>
  <small class="note" id="bwNote" style="display:block;margin:6px 0 12px">${tw?`Saved ${kgf(tw.kg)} kg for today.`:"Weigh yourself in the morning, before eating."}</small>
  ${last?`<div class="stats">
   <div class="macro"><small>Current</small><div class="big">${kgf(last.kg)} kg</div><small>${fmtD(last.d)}</small></div>
   <div class="macro"><small>Since start</small><div class="big">${chg(last.kg,first.kg)}</div><small>from ${kgf(first.kg)} kg on ${fmtD(first.d)}</small></div>
   <div class="macro"><small>Last 7 days</small><div class="big">${wk&&wk!==last?chg(last.kg,wk.kg):"—"}</div><small>${wk&&wk!==last?"vs "+fmtD(wk.d):"needs a week of entries"}</small></div>
   <div class="macro"><small>To goal</small><div class="big">${P.goal?chg(P.goal,last.kg).replace(/^[+−±]/,""):"—"}</div><small>${P.goal?"goal "+kgf(P.goal)+" kg":"set a goal below"}</small></div>
  </div><div id="wChart" style="margin-top:14px"></div>`:'<p class="note" style="margin:0">No weigh-ins yet. Save today\'s weight above to start your chart.</p>'}
  <div class="goalrow"><label for="wGoal">Goal weight (kg)</label><input id="wGoal" type="number" inputmode="decimal" step="0.1" min="30" max="250" placeholder="optional" value="${P.goal??""}"></div>
  ${w.length?`<details class="hist"><summary>All weigh-ins (${w.length})</summary><div class="tbl-wrap"><table><thead><tr><th>Date</th><th class="n">Weight</th><th class="n">Change</th><th></th></tr></thead><tbody>
   ${[...w].reverse().map((e,i,a)=>`<tr><td>${fmtD(e.d)}</td><td class="n">${kgf(e.kg)} kg</td><td class="n">${a[i+1]?chg(e.kg,a[i+1].kg):""}</td><td class="n"><button class="del" data-w="${e.d}" aria-label="Delete ${fmtD(e.d)}">×</button></td></tr>`).join("")}
  </tbody></table></div></details>`:""}</div>`;

  h+=`<div class="panel" style="margin-top:16px"><h2>Strength</h2>`;
  if(!logged.length) h+='<p class="note" style="margin:0">No sets logged yet. Log your sets under each exercise in the Exercises tab and your progress shows up here. Warm-up sets aren\'t counted.</p>';
  else{
    const sum=logged.map(n=>{const L=W.filter(e=>e.ex===n).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
      const top=d=>L.filter(e=>e.d===d).reduce((m,e)=>!m||e.kg>m.kg||(e.kg===m.kg&&e.reps>m.reps)?e:m,null);
      const f=top(L[0].d),l=top(L[L.length-1].d),best=L.reduce((m,e)=>!m||e.kg>m.kg||(e.kg===m.kg&&e.reps>m.reps)?e:m,null);
      return {n,f,l,best,s:new Set(L.map(e=>e.d)).size};});
    h+=`<div class="stats three"><div class="macro"><small>Workouts logged</small><div class="big">${days.size}</div><small>days with sets</small></div>
     <div class="macro"><small>Last 4 weeks</small><div class="big">${[...days].filter(d=>d>=since).length}</div><small>workouts</small></div>
     <div class="macro"><small>Exercises</small><div class="big">${logged.length}</div><small>tracked</small></div></div>
    <div class="tbl-wrap" style="margin-top:12px"><table class="lifts"><thead><tr><th>Exercise</th><th class="n">First</th><th class="n">Best</th><th class="n">Change</th></tr></thead><tbody>
     ${sum.map(r=>{const d=Math.round((r.best.kg-r.f.kg)*10)/10;return `<tr data-ex="${esc(r.n)}"${r.n===proEx?' class="sel"':""}><td><button type="button" class="lk">${esc(r.n)}</button><small>${r.s} session${r.s>1?"s":""}</small></td><td class="n">${kgf(r.f.kg)}×${r.f.reps}</td><td class="n">${kgf(r.best.kg)}×${r.best.reps}</td><td class="n ${d>0?"up":""}">${d>0?"+"+kgf(d)+" kg":d<0?"−"+kgf(-d)+" kg":"—"}</td></tr>`;}).join("")}
    </tbody></table></div>
    <h3 style="margin:16px 0 4px">${esc(proEx)}</h3><p class="note" style="margin:0 0 6px">Heaviest set per workout. Tap a row above to switch exercise.</p>
    <div id="lChart"></div>
    <details class="hist"><summary>All sets for this exercise</summary><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Set</th><th class="n">Weight</th><th class="n">Reps</th><th></th></tr></thead><tbody>
     ${P.l.map((e,i)=>({e,i})).filter(x=>x.e.ex===proEx).sort((a,b)=>a.e.d<b.e.d?1:a.e.d>b.e.d?-1:(a.e.s??99)-(b.e.s??99)).map(({e,i})=>`<tr><td>${fmtD(e.d)}</td><td>${e.s==null?"":setName(e.s)}</td><td class="n">${kgf(e.kg)} kg</td><td class="n">${e.reps}</td><td class="n"><button class="del" data-l="${i}" aria-label="Delete set">×</button></td></tr>`).join("")}
    </tbody></table></div></details>`;
  }
  h+=`</div><p class="note" style="margin:12px 2px 0">Your progress is saved on this device and browser only.</p>`;
  $("#tab-pro").innerHTML=h;

  const draw=()=>{if(last)lineChart($("#wChart"),w.map(e=>({d:e.d,v:e.kg})),"kg",P.goal);
    if(!logged.length)return;const top={};W.filter(e=>e.ex===proEx).forEach(e=>{if(!top[e.d]||e.kg>top[e.d].kg||(e.kg===top[e.d].kg&&e.reps>top[e.d].reps))top[e.d]=e;});
    lineChart($("#lChart"),Object.values(top).sort((a,b)=>a.d<b.d?-1:1).map(e=>({d:e.d,v:e.kg,tip:`${kgf(e.kg)} kg × ${e.reps}`})),"kg");};
  draw();window.onresize=()=>{if(!$("#tab-pro").classList.contains("hidden"))draw();};
  $("#bwForm").onsubmit=e=>{e.preventDefault();const kg=parseFloat($("#bwKg").value);if(!(kg>=30&&kg<=250)){$("#bwNote").textContent="Enter a weight between 30 and 250 kg.";$("#bwKg").focus();return;}
    P.w=P.w.filter(x=>x.d!==today());P.w.push({d:today(),kg});setPro(P);renderPro();};
  $("#wGoal").onchange=()=>{const g=parseFloat($("#wGoal").value);P.goal=g>=30&&g<=250?g:null;setPro(P);renderPro();};
  $("#tab-pro").onclick=e=>{const r=e.target.closest("tr[data-ex]");if(r){proEx=r.dataset.ex;renderPro();return;}
    const b=e.target.closest(".del");if(!b)return;
    if(b.dataset.w)P.w=P.w.filter(x=>x.d!==b.dataset.w);else P.l.splice(+b.dataset.l,1);setPro(P);renderPro();};
}

/* ---------- theme ---------- */
(function(){let t=null;try{t=localStorage.getItem("theme");}catch(e){} if(t)document.documentElement.dataset.theme=t;
 $("#themeBtn").onclick=()=>{const cur=document.documentElement.dataset.theme||"dark";
  const nx=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=nx;try{localStorage.setItem("theme",nx);}catch(e){}};})();

/* ---------- add to home screen ---------- */
(function(){
 if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
 const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
 let snoozed=false;try{snoozed=Date.now()<+(localStorage.getItem("installSnooze")||0);}catch(e){}
 if(standalone||snoozed) return;
 const box=$("#install"),go=$("#installGo");
 const ua=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 let deferred=null;
 window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;go.classList.remove("hidden");box.classList.remove("hidden");});
 go.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;box.classList.add("hidden");};
 $("#installX").onclick=()=>{box.classList.add("hidden");try{localStorage.setItem("installSnooze",Date.now()+3*864e5);}catch(e){}};
 window.addEventListener("appinstalled",()=>box.classList.add("hidden"));
 if(isIOS){
  $("#installMsg").innerHTML=/CriOS|FxiOS|EdgiOS/.test(ua)
   ?'Tap the <b style="display:inline;font:inherit;font-weight:600">Share</b> icon, then <b style="display:inline;font:inherit;font-weight:600">Add to Home Screen</b>.'
   :'Tap <b style="display:inline;font:inherit;font-weight:600">Share</b> <span aria-hidden="true">&#x2191;&#xFE0E;</span> below, then <b style="display:inline;font:inherit;font-weight:600">Add to Home Screen</b>.';
  setTimeout(()=>box.classList.remove("hidden"),1500);
 }
})();

if(user&&user.name) (user.prog&&PROGRAMS[user.prog]?openApp():showChooser()); else $("#nm").focus();
</script>
</body>
</html>
